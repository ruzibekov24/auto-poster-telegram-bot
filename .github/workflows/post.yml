name: Post Facts

on:
  schedule:
    # 04:00 UTC = 09:00 Asia/Tashkent (UTC+5, DST yo'q)
    - cron: "0 4 * * *"
  workflow_dispatch: {}   # Actions sahifasidan qo'lda ham ishga tushirish mumkin

permissions:
  contents: write   # recent_facts.json'ni commit qilib qaytarish uchun

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Fakt postini yuborish
        run: python -c "import asyncio; from main import send_fact_post; asyncio.run(send_fact_post())"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}

      - name: recent_facts.json ni repoga qaytarish
        run: |
          git config user.name "facts-bot"
          git config user.email "facts-bot@users.noreply.github.com"
          git add recent_facts.json
          git diff --cached --quiet || git commit -m "chore: update recent_facts.json [skip ci]"
          git push
