name: Post Facts

on:
  schedule:
    # 04:00 UTC = 09:00 Asia/Tashkent (UTC+5, DST yo'q) — fact post
    - cron: "0 4 * * *"
    # 09:00 UTC = 14:00 Asia/Tashkent — poll/viktorina
    - cron: "0 9 * * *"
    # 15:00 UTC = 20:00 Asia/Tashkent — flex/countdown post
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      post_type:
        description: "Qaysi post turini qo'lda yubormoqchisiz?"
        type: choice
        options:
          - facts
          - poll
          - flex
        default: facts

permissions:
  contents: write   # recent_*.json'ni commit qilib qaytarish uchun

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Post turini aniqlash
        id: which
        run: |
          if [ "${{ github.event.schedule }}" = "0 15 * * *" ]; then
            echo "target=flex" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then
            echo "target=poll" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 4 * * *" ]; then
            echo "target=facts" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ github.event.inputs.post_type || 'facts' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Postni yuborish
        run: |
          case "${{ steps.which.outputs.target }}" in
            flex)
              python -c "import asyncio; from main import send_flex_countdown_post; asyncio.run(send_flex_countdown_post())"
              ;;
            poll)
              python -c "import asyncio; from main import send_poll_post; asyncio.run(send_poll_post())"
              ;;
            *)
              python -c "import asyncio; from main import send_fact_post; asyncio.run(send_fact_post())"
              ;;
          esac
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}

      - name: recent_*.json ni repoga qaytarish
        run: |
          git config user.name "facts-bot"
          git config user.email "facts-bot@users.noreply.github.com"
          git add recent_facts.json recent_flex.json recent_polls.json
          git diff --cached --quiet || git commit -m "chore: update recent facts/flex/polls [skip ci]"
          git push
