name: Post Facts

on:
  schedule:
    # 04:00 UTC = 09:00 Asia/Tashkent (UTC+5, DST yo'q) — ertalabki post
    # (main.py MORNING_PLAN: haftada 2 marta fact, qolgan kunlari saytdan dars)
    - cron: "0 4 * * *"
    # 15:00 UTC = 20:00 Asia/Tashkent — kechki post
    # (main.py EVENING_PLAN: haftada 2 marta flex, qolgan kunlari real yangilik)
    - cron: "0 15 * * *"
    # ESLATMA: poll/viktorina (14:00) endi Cloudflare Worker'ning o'z cron
    # trigger'i orqali yuboriladi (admin-worker/src/index.ts), chunki
    # gamifikatsiya (ball tizimi) uchun poll_answer webhook kerak — bu faqat
    # Worker orqali ADMIN_BOT_TOKEN bilan olinadi. Shu sabab bu yerda YO'Q,
    # aks holda kanalga kuniga 2 marta poll ketib qoladi.
  workflow_dispatch:
    inputs:
      post_type:
        description: "Qaysi post turini qo'lda yubormoqchisiz?"
        type: choice
        options:
          - morning
          - evening
          - facts
          - flex
          - lesson
          - news
        default: morning

permissions:
  contents: write   # recent_*.json'ni commit qilib qaytarish uchun

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Post turini aniqlash
        id: which
        run: |
          if [ "${{ github.event.schedule }}" = "0 15 * * *" ]; then
            echo "target=evening" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 4 * * *" ]; then
            echo "target=morning" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ github.event.inputs.post_type || 'morning' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Postni yuborish
        run: |
          case "${{ steps.which.outputs.target }}" in
            morning) fn=send_morning_post ;;
            evening) fn=send_evening_post ;;
            facts)   fn=send_fact_post ;;
            flex)    fn=send_flex_countdown_post ;;
            lesson)  fn=send_lesson_post ;;
            news)    fn=send_news_post ;;
          esac
          python -c "import asyncio, main; asyncio.run(main.$fn())"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}

      - name: recent_*.json ni repoga qaytarish
        run: |
          git config user.name "facts-bot"
          git config user.email "facts-bot@users.noreply.github.com"
          git add recent_facts.json recent_flex.json
          git add recent_lessons.json recent_news.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update recent facts/flex/lessons/news [skip ci]"
          git push
